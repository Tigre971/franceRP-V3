<form id="survey-form" onsubmit="saveSurvey(event)">
    <label for="title">Titre du Sondage :</label>
    <input type="text" id="title" name="title" required>

    <label for="question">Question :</label>
    <textarea id="question" name="question" rows="4" required></textarea>

    <label for="options">Options (une par ligne) :</label>
    <textarea id="options" name="options" rows="4" required></textarea>

    <button type="submit" class="btn">Soumettre</button>
</form>

<script>
    function saveSurvey(event) {
        event.preventDefault(); // Empêche le rechargement de la page
        const title = document.getElementById('title').value;
        const question = document.getElementById('question').value;
        const options = document.getElementById('options').value.split('\\n');

        // Enregistrer les données dans localStorage
        const survey = { title, question, options };
        localStorage.setItem('latestSurvey', JSON.stringify(survey));

        // Rediriger vers la page des résultats
        window.location.href = 'results.html';
    }
</script>
